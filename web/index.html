<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战双剧情问答</title>
<script>
  // 主题要在首次绘制前定下来，否则会闪一下
  (() => {
    try {
      const forced = new URLSearchParams(location.search).get('theme');
      const saved = forced || localStorage.getItem('pgr-theme');
      const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = saved || sys;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<style>
  :root{
    /* 深色（默认）。带 -rgb 的变量让透明度也能跟着主题走 */
    --bg:#141518;
    --panel:#1b1d21;
    --panel-2:#212429;
    --line:#2b2f36;
    --fg:#e6e8ec;
    --fg-dim:#9aa1ad;
    --fg-faint:#6c7480;
    --accent:#d8b36a;
    --accent-rgb:216,179,106;
    --accent-soft:rgba(var(--accent-rgb),.12);
    --warn:#c9765a;
    --backdrop:rgba(0,0,0,.62);
    --shadow:0 24px 64px rgba(0,0,0,.5);
    --r:8px;
    --r-sm:6px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f6f5f1;
    --panel:#ffffff;
    --panel-2:#f0eee9;
    --line:#dcd8cf;
    --fg:#1e2126;
    --fg-dim:#575d66;
    --fg-faint:#8b9099;
    --accent:#9a6f24;
    --accent-rgb:154,111,36;
    --accent-soft:rgba(154,111,36,.10);
    --warn:#b0472e;
    --backdrop:rgba(28,24,16,.34);
    --shadow:0 20px 48px rgba(40,32,16,.18);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;row-gap:8px;
    padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1,header .upd,header .stat{white-space:nowrap}

  /* 启动遮罩：浏览器先弹出来，这里显示进度 */
  .boot{
    position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
    background:var(--bg);transition:opacity .3s ease;
  }
  .boot.done{opacity:0;pointer-events:none}
  .boot-inner{width:260px;text-align:center}
  .boot-title{font-size:15px;color:var(--fg);letter-spacing:.04em;margin-bottom:16px}
  .boot-bar{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}
  .boot-bar i{
    display:block;height:100%;width:0;border-radius:2px;background:var(--accent);
    transition:width .35s ease;
  }
  .boot-text{margin-top:12px;font-size:12px;color:var(--fg-faint);min-height:18px}
  .boot-text.err{color:var(--warn)}
  /* 窄屏先让出构建时间（调试信息），避免模型徽标被挤到第二行 */
  @media (max-width: 1100px){ #build{display:none} }
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.02em}
  .stat{font-size:12px;color:var(--fg-faint)}
  .upd{
    height:24px;padding:0 10px;border-radius:var(--r-sm);
    border:1px solid var(--line);background:transparent;color:var(--fg-dim);
    font:inherit;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;
  }
  .upd:hover:not(:disabled){color:var(--fg);border-color:var(--fg-faint);background:var(--panel-2)}
  .upd:disabled{opacity:.55;cursor:default}
  /* 图标按钮没有文字基线，baseline 对齐会偏高；统一按行盒中线对齐 */
  header .upd,header .badge{align-self:center}
  .upd.icon{width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  /* 按钮组整体右对齐：锚点放在组内第一个元素 */
  #export{margin-left:auto}
  header .upd{margin-left:8px}
  .upd.icon svg{display:block}
  .badge{
    margin-left:12px;font-size:12px;padding:2px 8px;border-radius:var(--r-sm);
    border:1px solid var(--line);color:var(--fg-dim);
  }
  .badge.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.35);background:var(--accent-soft)}

  main{flex:1;overflow-y:auto;padding:24px}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

  .turn{display:flex;flex-direction:column;gap:12px}
  .q{font-size:15px;color:var(--fg);padding-left:12px;border-left:2px solid var(--accent)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
  .card p{margin:0 0 12px}
  .card p:last-child{margin-bottom:0}
  .cite{color:var(--accent);white-space:nowrap}
  a.cite{cursor:pointer;border-bottom:1px dotted rgba(var(--accent-rgb),.5);text-decoration:none}
  a.cite:hover{background:rgba(var(--accent-rgb),.12);border-bottom-color:var(--accent)}
  .cite.bad{color:var(--warn);text-decoration:line-through}
  .card strong{color:var(--fg);font-weight:600}
  .card strong.h{display:block;margin:20px 0 8px;font-size:15px;color:var(--accent)}
  .card .lead{color:var(--fg-dim);font-size:13px}

  .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-faint)}
  .histbox{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
  .histbox>summary{padding:12px 16px;font-size:13px;color:var(--fg-dim);cursor:pointer}
  .histbox>summary:hover{color:var(--fg)}
  .histbox[open]>summary{border-bottom:1px solid var(--line);color:var(--fg)}
  .histlist{padding:16px;display:flex;flex-direction:column;gap:24px}
  .meta b{color:var(--fg-dim);font-weight:500}

  .sources{display:flex;flex-direction:column;gap:4px}
  .src{
    display:flex;gap:12px;align-items:baseline;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:6px 12px;text-decoration:none;color:inherit;
    transition:border-color .15s,background .15s;
  }
  .src:hover{border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.07)}
  .src .no{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:64px}
  .src .tt{font-size:13px;color:var(--fg)}
  .src .ch{font-size:12px;color:var(--fg-faint);margin-left:auto;white-space:nowrap}
  .src .peek{font-size:11px;color:var(--fg-faint);opacity:0;transition:opacity .15s}
  .src:hover .peek{opacity:1}
  .src.flat{cursor:default;border-color:transparent;background:transparent;padding-left:0}
  .src.flat:hover{background:transparent;border-color:transparent}

  /* 原文浮层 */
  .viewer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
  .viewer[hidden]{display:none}
  .viewer-backdrop{position:absolute;inset:0;background:var(--backdrop)}
  .viewer-panel{
    position:relative;width:min(760px,calc(100vw - 48px));max-height:min(80vh,880px);
    display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);
  }
  .viewer-head{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .viewer-title{font-size:15px;font-weight:600;color:var(--fg)}
  .viewer-sub{font-size:12px;color:var(--fg-faint);margin-top:4px}
  .viewer-close{
    margin-left:auto;height:28px;padding:0 12px;border-radius:var(--r-sm);
    border:1px solid var(--line);background:transparent;color:var(--fg-dim);
    font:inherit;font-size:12px;cursor:pointer;
  }
  .viewer-close:hover{color:var(--fg);border-color:var(--fg-faint)}
  .viewer-body{padding:20px 24px;overflow-y:auto;font-size:14px;line-height:1.9;color:var(--fg-dim)}
  .viewer-body>div{margin:0}
  .viewer-body .gap{height:10px}
  .viewer-body .stage{color:var(--accent);font-size:13px}
  .viewer-body .mark{
    display:inline-block;margin:16px 0 4px;padding:0 8px;border-radius:4px;
    background:rgba(var(--accent-rgb),.12);color:var(--accent);font-size:11px;line-height:18px;
  }
  .viewer-body .mark:first-child{margin-top:0}
  .viewer-body .branch{
    margin:0;padding:0 0 0 14px;border-left:2px solid rgba(var(--accent-rgb),.35);
    color:var(--fg-faint);
  }

  details{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);overflow:hidden}
  details[open]>summary{border-bottom:1px solid var(--line)}
  summary{
    cursor:pointer;padding:8px 12px;font-size:13px;color:var(--fg-dim);
    list-style:none;display:flex;gap:8px;align-items:center;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--fg-faint);transition:transform .15s;display:inline-block}
  details[open] summary::before{transform:rotate(90deg)}
  summary:hover{color:var(--fg)}
  .ev{padding:12px 16px;font-size:13px;color:var(--fg-dim);white-space:pre-wrap;line-height:1.8;max-height:360px;overflow:auto}

  .empty{color:var(--fg-faint);font-size:13px;text-align:center;padding:48px 0}

  footer{
    border-top:1px solid var(--line);background:var(--panel);padding:12px 24px;
  }
  .inputbar{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  textarea{
    flex:1;resize:none;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 14px;font:inherit;line-height:1.6;min-height:48px;max-height:160px;
    outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:rgba(var(--accent-rgb),.5)}
  textarea::placeholder{color:var(--fg-faint)}
  button{
    height:48px;padding:0 20px;border-radius:var(--r);border:1px solid rgba(var(--accent-rgb),.4);
    background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:500;cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  button:hover:not(:disabled){background:rgba(var(--accent-rgb),.2)}
  button:disabled{opacity:.45;cursor:default}
  .hint{max-width:820px;margin:8px auto 0;font-size:12px;color:var(--fg-faint)}
  .sendwrap{display:flex;flex-direction:column;align-items:center;flex:none;gap:4px}
  .ver{font-size:11px;line-height:1;color:var(--fg-faint);opacity:.65;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center}
  .kbd{margin-left:12px;color:var(--fg-faint);opacity:.75}
  .blist{display:flex;flex-direction:column;gap:2px}
  .bitem{
    display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--fg-dim);
    border:1px solid transparent;background:none;font:inherit;text-align:left;width:100%;
  }
  .bitem:hover{background:var(--accent-soft);border-color:rgba(var(--accent-rgb),.3);color:var(--fg)}
  .bitem b{font-weight:400;color:var(--fg)}
  .bitem span{flex:none;font-size:12px;color:var(--fg-faint)}
  .bempty{padding:16px 4px;color:var(--fg-faint);font-size:13px}
  .err{color:var(--warn);font-size:13px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--fg-faint);
        border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="boot-title">战双剧情问答</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-text" id="bootText">正在启动…</div>
  </div>
</div>

<header>
  <h1>战双剧情问答</h1>
  <span class="stat" id="stat">读取语料…</span>
  <span class="stat" id="spend"></span>
  <span class="stat" id="build" title="页面构建时间，用来确认浏览器没在跑旧缓存"></span>
  <a class="stat" id="wiki-link" target="_blank" rel="noreferrer"
     href="https://wiki.biligame.com/zspms/%E5%89%A7%E6%83%85%E5%9B%9E%E9%A1%BE"
     title="语料来源：战双 BWIKI 剧情回顾">wiki 源 ↗</a>
  <a class="stat" id="export" href="/api/history/export"
     style="color:var(--fg-dim);text-decoration:none;border-bottom:1px dotted var(--line)">导出历史</a>
  <button class="upd" id="browseBtn" title="按章节或关键词浏览剧情原文">原文</button>
  <button class="upd icon" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深色 / 浅色"></button>
  <button class="upd" id="updBtn" title="检查 wiki 是否有新内容；更新会抓取并重建索引。不要频繁点击，会触发站点限流。">更新语料</button>
  <button class="upd" id="keyBtn"
          title="填写 / 更换 DeepSeek API Key">设置密钥</button>
  <span class="badge" id="mode">…</span>
</header>

<main id="main"><div class="wrap" id="list">
  <div class="empty">问一句剧情，答案带出处。<br>例：露西亚第一次登场是在哪里？第12章讲了什么？</div>
</div></main>

<div class="viewer" id="keydlg" hidden>
  <div class="viewer-backdrop" data-keyclose="1"></div>
  <div class="viewer-panel" role="dialog" aria-modal="true" style="width:min(520px,calc(100vw - 48px))">
    <div class="viewer-head">
      <div>
        <div class="viewer-title">设置 API Key</div>
        <div class="viewer-sub" id="keySub">读取中…</div>
      </div>
      <button class="viewer-close" data-keyclose="1">关闭 Esc</button>
    </div>
    <div class="viewer-body" style="white-space:normal">
      <input id="keyInput" type="password" autocomplete="off" spellcheck="false"
             placeholder="sk-...（粘贴后点保存）"
             style="width:100%;box-sizing:border-box;background:var(--panel-2);color:var(--fg);
                    border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;outline:none">
      <div class="meta" style="margin-top:12px">
        <span>只写入本机 <code>config.json</code>，不会上传；格式不对会当场拒绝。</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="upd" id="keySave" style="margin-left:0;height:32px;padding:0 16px">保存并测试</button>
      </div>
      <div class="meta" id="keyMsg" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<div class="viewer" id="browse" hidden>
  <div class="viewer-backdrop" data-browseclose="1"></div>
  <div class="viewer-panel" role="dialog" aria-modal="true" style="width:min(640px,calc(100vw - 48px))">
    <div class="viewer-head">
      <div>
        <div class="viewer-title">浏览原文</div>
        <div class="viewer-sub" id="browseSub">按章节点开，或直接搜关卡名</div>
      </div>
      <button class="viewer-close" data-browseclose="1">关闭 Esc</button>
    </div>
    <div class="viewer-body" style="white-space:normal;max-height:58vh">
      <input id="browseQ" placeholder="搜关卡名 / 章节 / 序号，例如「薇拉」「13 终焉福音」"
             style="width:100%;box-sizing:border-box;background:var(--panel-2);color:var(--fg);
                    border:1px solid var(--line);border-radius:6px;padding:9px 12px;font:inherit;outline:none">
      <div id="browseList" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-backdrop" data-close="1"></div>
  <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <div>
        <div class="viewer-title" id="viewer-title">原文</div>
        <div class="viewer-sub" id="viewer-sub"></div>
      </div>
      <button class="viewer-close" data-close="1">关闭 Esc</button>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>
</div>

<footer>
  <div class="inputbar">
    <textarea id="q" rows="1" placeholder="问点什么…"></textarea>
    <div class="sendwrap">
      <button id="send">提问</button>
      <span class="ver" id="ver" title="版本号"></span>
    </div>
  </div>
  <div class="hint" id="opts">
    <label style="cursor:pointer;user-select:none">
      <input type="checkbox" id="web" checked style="vertical-align:-1px"> 联网补充
      <span style="color:var(--fg-faint)">（BWIKI / 哔哩哔哩 / 玩家社区；结果标为外部资料，不当作台词）</span>
      <span class="kbd">Enter 发送 · Ctrl+Enter 换行</span>
    </label>
  </div>
  <div class="hint" id="hint"></div>
  <div class="hint" id="updmsg"></div>
</footer>

<script>
const list = document.getElementById('list');
const q = document.getElementById('q');
const send = document.getElementById('send');
const hint = document.getElementById('hint');
let busy = false;
// 追问（"你推断呢"）本身不含内容词，必须把上文一起发过去
let history = [];
// 会话 id：同一标签页刷新后不变，用来区分"本次会话"和"更早的历史"
const SID = new URLSearchParams(location.search).get('sid')
  || (() => {
       let v = sessionStorage.getItem('pgr_sid');
       if(!v){ v = 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
               sessionStorage.setItem('pgr_sid', v); }
       return v;
     })();

// 历史记录：刷新页面也不丢，同时把上几轮喂回 agent 做追问上下文
function renderPast(turn, item){
  const citeCard = c => c.seq
    ? `<a class="src" href="javascript:void 0" data-seq="${c.seq}"
          data-title="${esc(c.title||'')}" data-sub="${esc((c.category||'')+'／'+(c.chapter||''))}">
         <span class="no">${c.seq}</span>
         <span class="tt">${esc(c.title||'')}</span>
         <span class="peek">查看原文</span>
         <span class="ch">${esc(c.category||'')}／${esc(c.chapter||'')}</span>
       </a>`
    : `<span class="src flat"><span class="tt">${esc(c.label||'')}</span></span>`;
  const cites = (item.citations||[]).map(citeCard).join('');
  const labelMap = {};
  (item.citations||[]).forEach(c => { if(c.label && c.seq) labelMap[c.label] = c; });
  const body = (item.answer||'').split(/\n{2,}/)
    .map(pp => `<p>${rich(pp, labelMap).replace(/\n/g,'<br>')}</p>`).join('');
  turn.innerHTML = `<div class="q">${esc(item.question)}</div>
    <div class="card">${body || '<p class="lead">（无回答）</p>'}</div>
    <div class="meta">
      <span><b>历史</b> ${esc((item.ts||'').replace('T',' ').slice(5,16))}</span>
      ${item.steps?`<span><b>步数</b> ${item.steps}</span>`:''}
      ${(item.tools||[]).length?`<span><b>工具</b> ${item.tools.length} 次</span>`:''}
      ${item.tokens?`<span><b>用量</b> ${item.tokens.toLocaleString()} tok</span>`:''}
      ${item.cost_cny?`<span><b>费用</b> ¥${item.cost_cny.toFixed(4)}</span>`:''}
    </div>
    ${cites?`<div class="sources">${cites}</div>`:''}`;
}

function showHistStatus(text){
  let el = document.getElementById('histstat');
  if(!el){
    el = document.createElement('div');
    el.id = 'histstat';
    el.className = 'meta';
    el.style.margin = '0';
    list.parentElement.insertBefore(el, list);
  }
  el.innerHTML = `<span>${esc(text)}</span>`;
}

async function loadHistory(){
  try{
    const r = await fetch('/api/history?limit=60&_=' + Date.now(), {cache: 'no-store'});
    const d = await r.json();
    if(!d.turns || !d.turns.length){
      showHistStatus(`历史：库里没有记录（接口返回 0 条）`);
      return;
    }
    showHistStatus(`历史：已载入 ${d.turns.length} 条`);
    const ph = list.querySelector('.empty'); if(ph) ph.remove();

    const mine = d.turns.filter(x => (x.session||'') === SID);      // 本次会话
    const older = d.turns.filter(x => (x.session||'') !== SID);     // 更早的历史

    // 追问上下文：优先本次会话，没有就退回最近的
    const ctx = (mine.length ? mine : d.turns).slice(0,3).reverse()
      .map(x => ({question: x.question, answer: x.answer || ''}));
    history = ctx;

    // 本次会话：像聊天一样直接铺开
    for(const item of mine.slice().reverse()){
      const t = document.createElement('div');
      t.className = 'turn';
      renderPast(t, item);
      list.appendChild(t);
    }

    // 更早的历史：默认收起
    if(older.length){
      const box = document.createElement('details');
      box.className = 'histbox';
      const sum = document.createElement('summary');
      const noTok = d.stats.turns_without_tokens || 0;
      sum.textContent = `更早的记录 ${older.length} 条（合计共 ${d.stats.turns} 条 · ¥${(d.stats.cost_cny||0).toFixed(3)}`
        + (noTok ? `，其中 ${noTok} 条为导入记录、无 token 明细` : '') + '）';
      box.appendChild(sum);
      const inner = document.createElement('div');
      inner.className = 'histlist';
      for(const item of older){
        const t = document.createElement('div');
        t.className = 'turn';
        renderPast(t, item);
        inner.appendChild(t);
      }
      box.appendChild(inner);
      if(new URLSearchParams(location.search).get('hist') === 'open') box.open = true;
      list.insertBefore(box, list.firstChild);
    }
  }catch(e){
    console.error('loadHistory failed', e);
    showHistStatus('历史载入失败：' + String(e && e.message || e));
  }
}

async function pollUpdate(){

    const s = await (await fetch('/api/update/status', {cache:'no-store'})).json();
    if(s.state === 'running'){

      setTimeout(pollUpdate, 1000);

        sayUpd(`wiki 源暂无新内容（已核对 ${s.result.pages || '—'} 个关卡 · ${s.result.checked_at || ''}）`);
      }else{
        const r = s.result || {};
        sayUpd(`${s.message || '更新完成'}：新增 ${r.new ?? 0} · 改动 ${r.changed ?? 0} · 删除 ${r.deleted ?? 0}，`
             + `共 ${r.pages ?? '—'} 关，用时 ${r.elapsed ?? '—'} 秒。刷新页面后生效。`);

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// highlight 【...】 citations and 「...」 quotes; render the small markdown the
// model actually uses (bold and leading dashes) instead of showing asterisks
function rich(s, labelMap){
  // 必须拼成一行：调用方会对整段做 \n -> <br>，多行标签会被拆坏
  const link = (raw) => {
    const hit = labelMap && labelMap[raw];
    if(!hit || !hit.seq) return `<span class="cite">【${raw}】</span>`;
    const title = esc(hit.title || '');
    const sub = esc((hit.category || '') + '／' + (hit.chapter || ''));
    return `<a class="cite" href="javascript:void 0" data-seq="${hit.seq}"`
         + ` data-title="${title}" data-sub="${sub}">【${raw}】</a>`;
  };
  return esc(s)
    .replace(/^#{1,4}\s*(.+)$/gm, '<strong class="h">$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^\s*[-*]\s+(?=\S)/gm, '· ')
    .replace(/【([^】]{1,80})】/g, (m, inner) =>
      inner.startsWith('未核实：') ? `<span class="cite bad">${m}</span>` : link(inner))
    .replace(/「[^」]{1,120}」/g, m => `<span style="color:var(--fg)">${m}</span>`);
}

function addTurn(question){
  const ph = list.querySelector('.empty');
  if(ph){ ph.remove(); }
  const t = document.createElement('div');
  t.className = 'turn';
  t.innerHTML = `<div class="q">${esc(question)}</div>
    <div class="card"><p class="lead"><span class="spin"></span> 检索中…</p></div>`;
  list.appendChild(t);
  list.parentElement.scrollTop = 1e9;
  return t;
}

function render(turn, d){
  const allCites = d.citations||[];
  // 正文里的【分类／章节／关卡】与下方出处是同一批，用标签建索引让正文也能点
  const labelMap = {};
  allCites.forEach(c => { if(c.label && c.seq) labelMap[c.label] = c; });
  const citeCard = c => c.seq
    ? `<a class="src" href="javascript:void 0" data-seq="${c.seq}"
          data-title="${esc(c.title||'')}" data-sub="${esc((c.category||'')+'／'+(c.chapter||''))}">
         <span class="no">${c.seq}</span>
         <span class="tt">${esc(c.title||'')}</span>
         <span class="peek">查看原文</span>
         <span class="ch">${esc(c.category||'')}／${esc(c.chapter||'')}</span>
       </a>`
    : `<span class="src flat"><span class="tt">${esc(c.label||c.title||'')}</span></span>`;
  // 整章归纳会带 20~30 个出处，全铺开会把答案顶出屏幕
  const cites = allCites.length > 6
    ? `<details><summary>出处：本章共 ${allCites.length} 关</summary>
         <div class="ev" style="max-height:420px">${allCites.map(citeCard).join('')}</div></details>`
    : allCites.map(citeCard).join('');

  const evs = (d.excerpts||[]).map((e,i) =>
    `<details><summary>证据 ${i+1}：${esc(e.title)}（${e.text.length.toLocaleString()} 字）</summary>
       <div class="ev">${esc(e.text)}</div></details>`).join('');

  const ext = (d.external||[]).map(r =>
    `<a class="src" href="${r.url}" target="_blank" rel="noreferrer">
       <span class="tt">${esc(r.title)}</span>
       <span class="ch">${esc(r.source)}</span>
     </a>`).join('');

  // 服务端所有"带正文"的 mode 都必须列在这里；漏一个，答案就会被当成错误吞掉
  const ANSWER_MODES = ['agent', 'max_steps', 'llm', 'summary', 'story', 'partial'];
  let answerHtml;
  if(ANSWER_MODES.includes(d.mode) && d.answer){
    // 段落之间是空行；段内的单换行是模型列的清单，必须保留换行，否则 1/2/3 会挤成一段
    answerHtml = d.answer.split(/\n{2,}/)
      .map(p => `<p>${rich(p, labelMap).replace(/\n/g,'<br>')}</p>`).join('');
  } else if(d.mode === 'evidence'){
    answerHtml = `<p>当前没有配置模型密钥，因此只给出检索到的原文与出处。</p>
      <p class="lead">把 key 写进 <code>config.json</code> 的 <code>api_key</code>，重启服务即可得到成句回答。</p>`;
  } else {
    answerHtml = `<p class="err">${esc(d.note || '出了点问题')}</p>`;
    const m = document.getElementById('mode');
    m.textContent = '模型调用失败'; m.classList.remove('on');
    m.title = d.note || '';
  }

  const usage = d.usage && d.usage.total_tokens ? ` · ${d.usage.total_tokens.toLocaleString()} tok` : '';
  const c = d.cost;
  const costHtml = c
    ? `<span><b>本次费用</b> ${c.cn}
         <span style="color:var(--fg-faint)">（${c.usage.total.toLocaleString()} tok
         ｜入 ${c.usage.prompt.toLocaleString()} / 出 ${c.usage.completion.toLocaleString()}${c.usage.hit?` / 缓存命中 ${c.usage.hit.toLocaleString()}`:''}
         ｜${c.band}价）</span></span>`
    : '';
  const isSummary = ['summary', 'story', 'partial'].includes(d.mode);
  const metaLabel = d.mode === 'story' ? '人物线' : '全章';
  turn.innerHTML = `<div class="q">${esc(d.question)}</div>
    <div class="card">${answerHtml}</div>
    <div class="meta">
      <span><b>${d.mode === 'agent' ? 'Agent' : '检索'}</b> ${d.search_ms} ms</span>
      ${d.steps ? `<span><b>步数</b> ${d.steps}</span>` : ''}
      ${(d.tool_calls||[]).length ? `<span><b>工具</b> ${d.tool_calls.length} 次</span>` : ''}
      ${d.mode === 'agent' || d.mode === 'max_steps'
        ? ''
        : (isSummary
            ? `<span><b>${metaLabel}</b> ${d.stage_count} 关 / ${(d.chars||0).toLocaleString()} 字</span>
               <span><b>分段归纳</b> ${d.batches} 段</span>`
            : `<span><b>证据</b> ${d.chars.toLocaleString()} 字</span>
               <span><b>送模型</b> ${(d.prompt_chars||0).toLocaleString()} 字</span>`)}
      <span><b>实体</b> ${(d.entities||[]).join('、') || '—'}</span>
      ${d.chapter_hint?`<span><b>章节</b> ${esc(d.chapter_hint)}</span>`:''}
      ${costHtml}
    </div>
    ${(d.note && (d.mode === 'agent' || d.mode === 'max_steps'))
      ? `<div class="meta"><span class="err">⚠ ${esc(d.note)}</span></div>` : ''}
    ${cites?`<div class="sources">${cites}</div>`:''}
    ${ext?`<div class="sources"><div class="lead" style="font-size:12px;color:var(--fg-faint)">外部检索（非剧情原文，仅供确认别名与设定）</div>${ext}</div>`:''}
    ${evs?`<div class="sources">${evs}</div>`:''}`;
  if(c && c.total_cn){ document.getElementById('spend').textContent = `本次运行累计 ${c.total_cn}`; }
}

const viewer = document.getElementById('viewer');
const vTitle = document.getElementById('viewer-title');
const vSub = document.getElementById('viewer-sub');
const vBody = document.getElementById('viewer-body');

function closeViewer(){ viewer.hidden = true; document.body.style.overflow = ''; }

function renderStageText(text){
  let html = '';
  for(const line of text.split('\n')){
    if(!line.trim()){ html += '<div class="gap"></div>'; continue; }
    const indented = /^\s{2,}/.test(line);
    const body = indented ? line.replace(/^\s+/, '') : line;
    const m = body.match(/^\[([^\]]{1,14})\](.*)$/);
    const inner = m
      ? `<span class="mark">${m[1]}</span>` + (m[2] ? ' ' + esc(m[2]) : '')
      : esc(body);
    html += indented ? `<div class="branch">${inner}</div>` : `<div>${inner}</div>`;
  }
  return html;
}

async function openStage(seq, title, sub){
  vTitle.textContent = title || '原文';
  vSub.textContent = sub || '';
  vBody.innerHTML = '<span class="stage">读取中…</span>';
  viewer.hidden = false;
  document.body.style.overflow = 'hidden';
  try{
    const r = await fetch('/api/stage?seq=' + encodeURIComponent(seq));
    const d = await r.json();
    if(!d.ok){ vBody.innerHTML = `<span class="err">读取失败：${esc(d.error||'')}</span>`; return; }
    vTitle.textContent = d.title || title || '原文';
    vSub.textContent = `${d.category}／${d.chapter}　序号 ${d.seq}　${(d.chars||0).toLocaleString()} 字`;
    vBody.innerHTML = renderStageText(d.text || '（本关没有正文）');
    vBody.scrollTop = 0;
  }catch(e){
    vBody.innerHTML = `<span class="err">读取失败：${esc(String(e.message||e))}</span>`;
  }
}

document.addEventListener('click', e => {
  const close = e.target.closest('[data-close]');
  if(close){ closeViewer(); return; }
  const hit = e.target.closest('[data-seq]');
  if(hit){
    e.preventDefault();
    openStage(hit.getAttribute('data-seq'),
              hit.getAttribute('data-title'),
              hit.getAttribute('data-sub'));
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !viewer.hidden) closeViewer();
});

async function ask(){
  const question = q.value.trim();
  if(!question || busy) return;
  busy = true; send.disabled = true; hint.textContent = '';
  const turn = addTurn(question);
  q.value = ''; q.style.height = 'auto';
  try{
    const r = await fetch('/api/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, history, session: SID, web: document.getElementById('web').checked})
    });
    const d = await r.json();
    if(d.error){ throw new Error(d.error); }
    render(turn, d);
    history.push({question: d.question || question, answer: d.answer || ''});
    if(history.length > 4){ history = history.slice(-4); }
  }catch(e){
    turn.innerHTML = `<div class="q">${esc(question)}</div>
      <div class="card"><p class="err">请求失败：${esc(String(e.message||e))}</p></div>`;
  }finally{
    busy = false; send.disabled = false;
    document.getElementById('main').scrollTop = 1e9;
  }
}

send.addEventListener('click', ask);
q.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  // Ctrl+Enter / Shift+Enter 换行：自己插，不依赖浏览器默认行为
  if(e.ctrlKey || e.metaKey || e.shiftKey){
    e.preventDefault();
    const at = q.selectionStart ?? q.value.length;
    const end = q.selectionEnd ?? at;
    q.value = q.value.slice(0, at) + '\n' + q.value.slice(end);
    q.selectionStart = q.selectionEnd = at + 1;
    q.dispatchEvent(new Event('input'));
    return;
  }
  e.preventDefault(); ask();
});
q.addEventListener('input', () => {
  q.style.height = 'auto';
  // border-box：scrollHeight 不含 border，直接赋值会让内容溢出 2px，出现滚动条
  q.style.height = Math.min(q.scrollHeight + 2, 160) + 'px';
});

})();

const browseDlg = document.getElementById('browse');
const browseQ = document.getElementById('browseQ');
const browseList = document.getElementById('browseList');

function bItem(label, right, onClick){
  const b = document.createElement('button');
  b.className = 'bitem';
  b.innerHTML = `<b>${esc(label)}</b><span>${esc(right || '')}</span>`;
  b.addEventListener('click', onClick);
  return b;
}

function bRender(nodes, note){
  browseList.innerHTML = '';
  if(note) browseSub.textContent = note;
  if(!nodes.length){
    browseList.innerHTML = '<div class="bempty">没找到，换个关键词试试</div>';
    return;
  }
  const box = document.createElement('div');
  box.className = 'blist';
  nodes.forEach(n => box.appendChild(n));
  browseList.appendChild(box);
}

async function bChapters(){
  browseQ.value = '';
  const d = await (await fetch('/api/stages', {cache:'no-store'})).json();
  bRender((d.chapters || []).map(c =>
    bItem(c.chapter, c.n + ' 节', () => bChapter(c.chapter))), '按章节——点一章看里面的剧情');
}

async function bChapter(name){
  const d = await (await fetch('/api/stages?chapter=' + encodeURIComponent(name), {cache:'no-store'})).json();
  const back = bItem('← 返回章节列表', '', bChapters);
  bRender([back, ...(d.items || []).map(it =>
    bItem(it.title, it.seq || '', () => { closeBrowse(); openStage(it.seq, it.title, (it.category || '')); }))],
    '章节：' + name);
}

let bTimer = null;
function bSearch(q){
  clearTimeout(bTimer);
  if(!q.trim()){ bChapters(); return; }
  bTimer = setTimeout(async () => {
    const d = await (await fetch('/api/stages?q=' + encodeURIComponent(q), {cache:'no-store'})).json();
    bRender((d.items || []).map(it =>
      bItem(it.title, [it.category, it.chapter].filter(Boolean).join('／'),
        () => { closeBrowse(); openStage(it.seq, it.title, (it.category || '') + '／' + (it.chapter || '')); })),
      `搜索「${q}」`);
  }, 200);
}

function openBrowse(){
  browseDlg.hidden = false;
  document.body.style.overflow = 'hidden';
  browseQ.value = '';
  browseQ.focus();
  const c = new URLSearchParams(location.search).get('chapter');
  if(c){ bChapter(c); } else { bChapters(); }
}

function closeBrowse(){
  browseDlg.hidden = true;
  if(viewer.hidden) document.body.style.overflow = '';
}

document.getElementById('browseBtn').addEventListener('click', openBrowse);
browseQ.addEventListener('input', e => bSearch(e.target.value));
browseDlg.addEventListener('click', e => { if(e.target.closest('[data-browseclose]')) closeBrowse(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !browseDlg.hidden) closeBrowse();
});

// ---------- 启动进度 ----------
const bootEl = document.getElementById('boot');
const bootBar = document.getElementById('bootBar');
const bootText = document.getElementById('bootText');

function setBoot(pct, text, isErr){
  bootBar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  bootText.textContent = text || '';
  bootText.classList.toggle('err', !!isErr);
}

const BOOT_DELAY = 220;   // 快启动时不要闪一下遮罩
async function waitReady(){
  const t0 = performance.now();
  let shown = false;
  for(;;){
    try{
      const r = await fetch('/api/health', {cache:'no-store'});
      const d = await r.json();
      setBoot(d.pct ?? 10, d.stage || '加载中…');
      if(d.ready){
        setBoot(100, '就绪');
        break;
      }
      if((d.stage || '').startsWith('初始化失败')){
        bootEl.style.display = 'flex';
        setBoot(0, d.stage, true);
        return false;
      }
    }catch(e){
      setBoot(5, '等待服务启动…');
    }
    if(!shown && performance.now() - t0 > BOOT_DELAY){
      bootEl.style.display = 'flex';
      shown = true;
    }
    await new Promise(r => setTimeout(r, 200));
  }
  if(!shown){                     // 初始化够快，遮罩没出现过，直接进主界面
    bootEl.style.display = 'none';
    return true;
  }
  bootEl.classList.add('done');
  setTimeout(() => { bootEl.style.display = 'none'; }, 320);
  return true;
}

waitReady().then(ok => {
  if(!ok) return;
  health();
  loadHistory();
});
q.focus();

// ?stage=序号 直接打开某关原文（分享/核对用）
// ?key=1 直接打开设置密钥弹窗（便于核对/分享）
if(new URLSearchParams(location.search).get('key') === '1'){ openKeyDialog(); }
// ?browse=1 直接打开原文浏览
if(new URLSearchParams(location.search).get('browse') === '1'){ openBrowse(); }

const _stageParam = new URLSearchParams(location.search).get('stage');
if(_stageParam){ openStage(_stageParam, '', ''); }

// ?q=... runs the question on load (shareable links, and lets a headless
// browser verify the answered layout without simulating input)
const preset = new URLSearchParams(location.search).get('q');
if(preset){ q.value = preset; ask(); }
</script>
